name: R-CMD-check

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  # CI Job - Test the R package
  R-CMD-check:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: 'release'

      - name: Setup R dependencies
        uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: |
            lintr
          needs: |
            lint
            
      - name: Check package
        uses: r-lib/actions/check-r-package@v2

      - name: Run lintr
        shell: Rscript {0}
        run: |
          # Fail the job if there are any lint issues
          results <- lintr::lint_package()
          print(results)
          if (length(results) > 0) {
            stop("Lint errors found. See output above.")
          }